<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시즌별 구종 분석</title>
    <style>
        :root {
            --primary-color: #c92a2a;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #111111 !important;
            --text-sub: #6c757d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 24px 16px;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px 20px 20px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        .profile-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
        }
        h1 { 
            font-size: 22px !important; 
            font-weight: 800 !important; 
            color: #111111 !important; 
            margin: 0 0 6px 0; 
            letter-spacing: -0.5px;
        }
        .subtitle { 
            color: var(--text-sub); 
            font-size: 13px; 
            font-weight: 500;
            margin-bottom: 15px;
        }
        
        /* 🧭 네비게이션 메뉴 바 */
        .nav-menu {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
            padding-bottom: 18px;
            border-bottom: 2px solid #f1f3f5;
        }
        .nav-btn {
            padding: 6px 12px;
            background-color: #f1f3f5;
            color: #495057;
            text-decoration: none;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            background-color: #e9ecef;
            color: #111;
        }
        .nav-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        /* 🔽 시즌 선택 헤더 & 드롭다운 */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h2 { 
            font-size: 16px !important; 
            font-weight: 700 !important; 
            color: #111111 !important; 
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
        }

        .season-select-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .season-select {
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 700;
            color: #111;
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .season-select:focus {
            border-color: var(--primary-color);
        }

        /* 테이블 디자인 */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            background: white;
            -webkit-overflow-scrolling: touch;
        }
        .pitch-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 13px;
            white-space: nowrap;
        }
        .pitch-table th {
            background-color: #1a1a1a;
            color: white;
            padding: 12px 10px;
            font-weight: 700;
            font-size: 12px;
        }
        .pitch-table td {
            padding: 11px 10px;
            border-bottom: 1px solid #f1f3f5;
            color: #333;
        }
        .pitch-table tr:hover td {
            background-color: #f8f9fa;
        }
        .col-highlight {
            font-weight: 700;
            color: var(--primary-color) !important;
            background-color: #fff9f9;
        }

        .empty-text {
            font-size: 13px;
            color: var(--text-sub);
            text-align: center;
            padding: 24px;
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: center;
            font-size: 12px;
            color: #888;
        }
        .instagram-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .instagram-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #444;
            text-decoration: none;
            font-weight: 600;
            padding: 6px 12px;
            background: #f1f3f5;
            border-radius: 20px;
            transition: all 0.2s ease;
        }
        .instagram-link:hover {
            background: #e9ecef;
            color: var(--primary-color);
        }
        .copyright {
            color: #aaa;
            font-size: 11px;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-container">
            <img src="https://roarunto92.github.io/roun/260909_2nd.jpg?w=150" alt="선수 프로필" class="profile-img">
        </div>

        <div class="header">
            <h1>경기별 구종 분석</h1>
            <div class="subtitle">Pitch-by-Pitch Statistics</div>
            <div class="subtitle">source. https://www.statiz.co.kr/</div>

            <nav class="nav-menu">
                <a href="index.html" class="nav-btn">HOME</a>
                <a href="stats.html" class="nav-btn">통산성적</a>
                <a href="pitch.html" class="nav-btn active">구종</a>
                <a href="2023.html" class="nav-btn">2023</a>
                <a href="2024.html" class="nav-btn">2024</a>
                <a href="2025.html" class="nav-btn">2025</a>
                <a href="2026.html" class="nav-btn">2026</a>
                <a href="download.html" class="nav-btn">DOWNLOAD</a>
            </nav>
        </div>

        <section>
            <!-- 🔽 상단 제목과 시즌 선택 드롭다운 -->
            <div class="section-header">
                <h2>⚾ 경기별 투구수 및 구종 분포</h2>
                <div class="season-select-wrapper">
                    <label for="seasonSelect" style="font-size: 13px; font-weight: 600; color: #555;">시즌 선택:</label>
                    <select id="seasonSelect" class="season-select" onchange="onSeasonChange()">
                        <option value="2026" selected>2026시즌</option>
                        <option value="2025">2025시즌</option>
                        <option value="2024">2024시즌</option>
                        <option value="2023">2023시즌</option>
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <table class="pitch-table">
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>상대팀</th>
                            <th>전체투구</th>
                            <th>투심</th>
                            <th>포심</th>
                            <th>커터</th>
                            <th>커브</th>
                            <th>슬라이더</th>
                            <th>체인지업</th>
                            <th>싱커</th>
                            <th>포크</th>
                            <th>너클</th>
                            <th>기타</th>
                        </tr>
                    </thead>
                    <tbody id="pitch-tbody">
                        <tr><td colspan="13" class="empty-text">구종 기록을 불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <footer class="footer">
            <div class="instagram-group">
                <a href="https://www.instagram.com/_roun92_?stkn=M2lpMjQ5YmZ3c3c1" target="_blank" rel="noopener noreferrer" class="instagram-link">
                    ⚾ @_roun92_
                </a>
                <a href="https://www.instagram.com/roar_unto.92?stkn=MW1kY2czamNtN2gydg==" target="_blank" rel="noopener noreferrer" class="instagram-link">
                    📸 @roar_unto.92
                </a>
            </div>
            <div class="copyright">
                © 2026 roar_unto.92. All rights reserved.
            </div>
        </footer>
    </div>

    <script>
        // ⚠️ 각 연도별 구종 시트 탭의 웹 게시(CSV) 링크를 입력해주세요.
        const PITCH_CSV_URLS = {
            '2026': 'YOUR_2026_PITCH_CSV_LINK_HERE',
            '2025': 'YOUR_2025_PITCH_CSV_LINK_HERE',
            '2024': 'YOUR_2024_PITCH_CSV_LINK_HERE',
            '2023': 'YOUR_2023_PITCH_CSV_LINK_HERE'
        };

        function parseCSV(text) {
            let lines = [];
            let row = [''];
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let nextC = text[i + 1];
                if (c === '"') {
                    if (inQuotes && nextC === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && nextC === '\n') { i++; }
                    lines.push(row); row = [''];
                } else { row[row.length - 1] += c; }
            }
            if (row.length > 1 || row[0] !== '') { lines.push(row); }
            return lines;
        }

        async function loadPitchData(year) {
            const tbody = document.getElementById('pitch-tbody');
            tbody.innerHTML = `<tr><td colspan="13" class="empty-text">${year}시즌 기록을 불러오는 중...</td></tr>`;

            const url = PITCH_CSV_URLS[year];
            if (!url || url.includes('YOUR_')) {
                tbody.innerHTML = `<tr><td colspan="13" class="empty-text">${year}시즌 CSV 링크가 설정되지 않았습니다.</td></tr>`;
                return;
            }

            try {
                const response = await fetch(url);
                const data = await response.text();
                const rows = parseCSV(data);
                
                let tableHTML = '';

                // 1행(헤더) 건너뛰기
                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i];
                    if (cols.length < 3) continue;

                    const date     = cols[0] ? cols[0].trim() : '';
                    const opponent = cols[1] ? cols[1].trim() : '';
                    const total    = cols[2] ? cols[2].trim() : '-';
                    const twoSeam  = cols[3] ? cols[3].trim() : '-';
                    const fourSeam = cols[4] ? cols[4].trim() : '-';
                    const cutter   = cols[5] ? cols[5].trim() : '-';
                    const curve    = cols[6] ? cols[6].trim() : '-';
                    const slider   = cols[7] ? cols[7].trim() : '-';
                    const changeUp = cols[8] ? cols[8].trim() : '-';
                    const sinker   = cols[9] ? cols[9].trim() : '-';
                    const fork     = cols[10] ? cols[10].trim() : '-';
                    const knuckle  = cols[11] ? cols[11].trim() : '-';
                    const etc      = cols[12] ? cols[12].trim() : '-';

                    if (!date) continue;

                    tableHTML += `
                        <tr>
                            <td><strong>${date}</strong></td>
                            <td>${opponent}</td>
                            <td class="col-highlight">${total}</td>
                            <td>${twoSeam}</td>
                            <td>${fourSeam}</td>
                            <td>${cutter}</td>
                            <td>${curve}</td>
                            <td>${slider}</td>
                            <td>${changeUp}</td>
                            <td>${sinker}</td>
                            <td>${fork}</td>
                            <td>${knuckle}</td>
                            <td>${etc}</td>
                        </tr>
                    `;
                }

                tbody.innerHTML = tableHTML || `<tr><td colspan="13" class="empty-text">${year}시즌 등록된 구종 데이터가 없습니다.</td></tr>`;
            } catch (error) {
                console.error('구종 데이터 로드 실패:', error);
                tbody.innerHTML = '<tr><td colspan="13" class="empty-text">데이터를 불러오지 못했습니다. CSV 링크를 확인해 주세요.</td></tr>';
            }
        }

        function onSeasonChange() {
            const select = document.getElementById('seasonSelect');
            loadPitchData(select.value);
        }

        // 초기 화면 실행 (2026시즌 기본 로드)
        loadPitchData('2026');
    </script>
</body>
</html>
