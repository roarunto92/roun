<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이로운 등판 기록 & 일정</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { font-size: 24px; text-align: center; color: #111; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 30px; }
        
        section { margin-bottom: 25px; }
        h2 { font-size: 18px; border-left: 4px solid #2b579a; padding-left: 10px; margin-bottom: 12px; color: #2b579a; }
        
        .card {
            background: #f9f9f9;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #eee;
            font-size: 14px;
        }
        .card .badge { background: #2b579a; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-right: 6px; }
        .card .date { font-weight: bold; color: #555; }
        .card .match { color: #000; font-weight: bold; }
        .card .record { color: #2b579a; margin-top: 4px; font-weight: bold; }
        .card .extra-info { margin-top: 6px; font-size: 13px; color: #666; }
    </style>
</head>
<body>

    <div class="container">
        <h1>이로운 등판 기록 및 일정</h1>
        <div class="subtitle">2023.04.02~ing</div>

        <!-- 다가오는 일정 섹션 -->
        <section>
            <h2>📅 다가오는 일정</h2>
            <div id="schedule-list">데이터를 불러오는 중...</div>
        </section>

        <!-- 지난 등판 기록 섹션 -->
        <section>
            <h2>📊 지난 등판 기록</h2>
            <div id="record-list">데이터를 불러오는 중...</div>
        </section>
    </div>

    <script>
        // ⚠️ 본인의 구글 시트 CSV 웹 게시 링크를 여기에 넣어주세요!
        const CSV_URL = 'YOUR_CSV_LINK_HERE';

        async function loadBaseballData() {
            try {
                const response = await fetch(CSV_URL);
                const data = await response.text();
                
                const rows = data.split('\n').map(row => row.split(','));
                
                let scheduleHTML = '';
                let recordHTML = '';

                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i];
                    if (cols.length < 6) continue;

                    const num = cols[0] ? cols[0].trim() : '';        // 경기
                    const type = cols[1] ? cols[1].trim() : '';      // 구분 (일정 또는 기록)
                    const date = cols[2] ? cols[2].trim() : '';      // 날짜
                    const opponent = cols[3] ? cols[3].trim() : '';  // 상대팀
                    const result = cols[4] ? cols[4].trim() : '';    // 결과
                    const memo = cols[5] ? cols[5].trim() : '';      // 메모
                    const record = cols[6] ? cols[6].trim() : '';    // 세부기록
                    const highlight = cols[8] ? cols[8].trim() : ''; // 하이라이트

                    const cardContent = `
                        <div class="card">
                            ${num ? `<span class="badge">${num}번째</span>` : ''}
                            <span class="date">${date}</span> | <span class="match">${opponent}</span>
                            <div class="record">${result} <span style="font-weight: normal; color: #555;">(${memo})</span></div>
                            ${record ? `<div class="extra-info">세부기록: ${record}</div>` : ''}
                            ${highlight ? `<div class="extra-info">하이라이트: <a href="${highlight}" target="_blank">바로가기</a></div>` : ''}
                        </div>
                    `;

                    if (type === '일정') {
                        scheduleHTML += cardContent;
                    } else if (type === '기록') {
                        recordHTML += cardContent;
                    }
                }

                document.getElementById('schedule-list').innerHTML = scheduleHTML || '<p>등록된 일정이 없습니다.</p>';
                document.getElementById('record-list').innerHTML = recordHTML || '<p>등록된 기록이 없습니다.</p>';

            } catch (error) {
                console.error('데이터를 불러오는 데 실패했습니다:', error);
                document.getElementById('schedule-list').innerHTML = '<p>데이터 로드 실패</p>';
                document.getElementById('record-list').innerHTML = '<p>데이터 로드 실패</p>';
            }
        }

        loadBaseballData();
    </script>
</body>
</html>
