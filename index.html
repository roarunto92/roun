<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>야구 선수 등판 기록 & 일정</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { font-size: 24px; text-align: center; color: #111; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 30px; }
        
        section { margin-bottom: 25px; }
        h2 { font-size: 18px; border-left: 4px solid #2b579a; padding-left: 10px; margin-bottom: 12px; color: #2b579a; }
        
        .card {
            background: #f9f9f9;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #eee;
            font-size: 14px;
        }
        .card .date { font-weight: bold; color: #555; }
        .card .match { color: #000; font-weight: bold; }
        .card .record { color: #2b579a; margin-top: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>선수 기록 대시보드</h1>
        <div class="subtitle">모바일 구글 시트 연동 실시간 업데이트</div>

        <!-- 다가오는 일정 섹션 -->
        <section>
            <h2>📅 다가오는 일정</h2>
            <div id="schedule-list">데이터를 불러오는 중...</div>
        </section>

        <!-- 지난 등판 기록 섹션 -->
        <section>
            <h2>📊 지난 등판 기록</h2>
            <div id="record-list">데이터를 불러오는 중...</div>
        </section>
    </div>

    <script>
        // ⚠️ 본인의 구글 시트 CSV 웹 게시 링크를 여기에 넣어주세요!
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVyUH61TK7HzrgNdXTkz3Dg2g1mVtI7tlx-SLeVluzfOR_jxbBpSF4zIvPDpOuV-7GQAdb86kPdrhr/pub?output=csv';

        async function loadBaseballData() {
            try {
                const response = await fetch(CSV_URL);
                const data = await response.text();
                
                const rows = data.split('\n').map(row => row.split(','));
                
                let scheduleHTML = '';
                let recordHTML = '';

                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i];
                    if (cols.length < 5) continue;

                    const type = cols[0].trim();      // 구분 (일정 또는 기록)
                    const date = cols[1].trim();      // 날짜
                    const opponent = cols[2].trim();  // 상대팀
                    const result = cols[3].trim();    // 결과
                    const memo = cols[4].trim();      // 메모/성적

                    const cardContent = `
                        <div class="card">
                            <span class="date">${date}</span> | <span class="match">${opponent}</span>
                            <div class="record">${result} <span style="font-weight: normal; color: #555;">(${memo})</span></div>
                        </div>
                    `;

                    if (type === '일정') {
                        scheduleHTML += cardContent;
                    } else if (type === '기록') {
                        recordHTML += cardContent;
                    }
                }

                document.getElementById('schedule-list').innerHTML = scheduleHTML || '<p>등록된 일정이 없습니다.</p>';
                document.getElementById('record-list').innerHTML = recordHTML || '<p>등록된 기록이 없습니다.</p>';

            } catch (error) {
                console.error('데이터를 불러오는 데 실패했습니다:', error);
                document.getElementById('schedule-list').innerHTML = '<p>데이터 로드 실패</p>';
                document.getElementById('record-list').innerHTML = '<p>데이터 로드 실패</p>';
            }
        }

        loadBaseballData();
    </script>
</body>
</html>
