        /* 🖼️ 이미지 미리보기 모달 팝업 */

<body>

    <div class="container">

        <div class="header">

    <!-- 미리보기 모달 -->
    <div id="previewModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <img id="modalImage" class="modal-img" src="" alt="미리보기">
            <div class="modal-footer">
                <span id="modalTitle" class="modal-title"></span>
                <div style="display: flex; gap: 8px;">
                    <a id="modalDownloadBtn" href="" target="_blank" rel="noopener noreferrer" class="btn-action btn-download">다운로드</a>
                    <button type="button" class="modal-close-btn" onclick="closeModal()">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 다운로드 전용 구글 시트의 CSV 웹 게시 링크를 넣어주세요!
        const CSV_URL = 'YOUR_DOWNLOAD_CSV_LINK_HERE';

        function parseCSV(text) {
            let lines = [];
            let row = [''];
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let nextC = text[i + 1];
                if (c === '"') {
                    if (inQuotes && nextC === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) { row.push(''); }
                else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && nextC === '\n') { i++; }
                    lines.push(row); row = [''];
                } else { row[row.length - 1] += c; }
            }
            if (row.length > 1 || row[0] !== '') { lines.push(row); }
            return lines;
        }

        function cleanUrl(raw) {
            if (!raw) return '';
            let s = raw.trim().replace(/^["']+|["']+$/g, '').trim();
            if (s.startsWith('www.')) s = 'https://' + s;
            return s;
        }

        // 💡 구글 드라이브 링크에서 고유 ID를 찾아 이미지 직링크 주소로 변환하는 함수
        function getPreviewImageUrl(url) {
            if (!url) return '';
            const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                // 구글 드라이브 파일 ID로 직접 이미지를 보여주는 안정적인 URL 생성
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            // 일반 이미지 링크인 경우 그대로 사용
            return url;
        }

        function openPreview(imgUrl, title, downloadUrl) {
            document.getElementById('modalImage').src = imgUrl;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalDownloadBtn').href = downloadUrl;
            document.getElementById('previewModal').style.display = 'flex';
        }

        function closeModal(event) {
            document.getElementById('previewModal').style.display = 'none';
            document.getElementById('modalImage').src = '';
        }

        async function loadDownloadData() {
            try {
                const response = await fetch(CSV_URL);
                const data = await response.text();
                const rows = parseCSV(data);
                
                let listHTML = '';

                // A열: 제목, B열: 설명, C열: 구글 드라이브 링크 (단 하나만 있어도 둘 다 해결!)
                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i];
                    if (cols.length < 3) continue;

                    const title = cols[0] ? cols[0].trim() : '';
                    const desc = cols[1] ? cols[1].trim() : '';
                    const driveUrl = cleanUrl(cols[2]);

                    if (!title) continue;

                    // 구글 드라이브 주소 하나로 미리보기 이미지 주소 자동 추출
                    const previewImg = getPreviewImageUrl(driveUrl);

                    listHTML += `
                        <div class="download-card">
                            <div class="download-info">
                                <div class="download-title" onclick="openPreview('${previewImg}', '${title}', '${driveUrl}')">
                                    🖼️ ${title}
                                </div>
                                <div class="download-desc">${desc}</div>
                            </div>
                            <div class="btn-group">
                                ${driveUrl ? `<button type="button" class="btn-action btn-preview" onclick="openPreview('${previewImg}', '${title}', '${driveUrl}')">미리보기</button>` : ''}
                                ${driveUrl ? `<a href="${driveUrl}" target="_blank" rel="noopener noreferrer" class="btn-action btn-download">다운로드</a>` : ''}
                            </div>
                        </div>
                    `;
                }

                document.getElementById('download-list').innerHTML = listHTML || '<div class="empty-text">등록된 다운로드 파일이 없습니다.</div>';
            } catch (error) {
                console.error('데이터 로드 실패:', error);
                document.getElementById('download-list').innerHTML = '<div class="empty-text">데이터를 불러오지 못했습니다. CSV 링크를 확인해 주세요.</div>';
            }
        }

        loadDownloadData();
    </script>
</body>
